[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clar-focus"
version = "0.1.0"
description = "Premium terminal productivity suite for Arch Linux, Wayland, Hyprland, and Waybar."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "clar" }
]
dependencies = [
  "textual>=0.58.1"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.0",
]

[project.scripts]
clar-focus = "omarchy_focus.cli:main"
clar-focus-hosts-helper = "omarchy_focus.focus_hosts_helper:main"
omarchy-focus = "omarchy_focus.cli:main"
focus = "omarchy_focus.legacy:main"
focus-indicator = "omarchy_focus.legacy:indicator_main"
omarchy-focus-hosts-helper = "omarchy_focus.focus_hosts_helper:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omarchy_focus"]

[tool.hatch.build.targets.sdist]
include = [
  "src/omarchy_focus",
  "README.md",
  "install.sh",
  "examples",
  "tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["omarchy_focus"]

[tool.mypy]
python_version = "3.12"
packages = ["omarchy_focus"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
